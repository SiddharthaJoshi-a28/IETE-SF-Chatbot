<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IETE-SF — Chat w Us</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
<style>
  /* ============================================================
     FONTS & DESIGN TOKENS
     Matches ietempstme.com / chat.html visual hierarchy
     ============================================================ */
  @font-face {
    font-family: 'Nohemi';
    src: url('./fonts/Nohemi-Regular-BF6438cc4d0e493.ttf') format('truetype');
    font-weight: 400; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'Nohemi';
    src: url('./fonts/Nohemi-Bold-BF6438cc587b5b5.ttf') format('truetype');
    font-weight: 700; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'Afacad';
    src: url('./fonts/Afacad-Regular.ttf') format('truetype');
    font-weight: 400; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'Afacad';
    src: url('./fonts/Afacad-Italic.ttf') format('truetype');
    font-weight: 400; font-style: italic; font-display: swap;
  }

  :root {
    --color-text: #1a1a1a;
    --color-bg: #F7F5F1;
    --color-accent: #1818FE;           /* IETE Swallow Blue */
    --color-accent-hover: #0a0ad8;
    --color-accent-light: #ececff;
    --color-accent-on-dark: #7070FF;
    --font-display: 'Nohemi', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-body: 'Afacad', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100vh; }
  body {
    background: var(--color-bg);
    color: var(--color-text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  img { max-width: 100%; display: block; }
  a { color: var(--color-accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  ul { list-style: none; padding: 0; margin: 0; }
  ::selection { background: var(--color-accent); color: #fff; }

  /* ============================== NAVBAR ============================== */
  .site-nav {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: min(920px, calc(100% - 32px));
    height: 60px;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(0, 0, 0, 0.08);
    border-radius: 999px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px 0 20px;
    z-index: 1000;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
  }
  .site-nav__brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.05rem;
    color: #111;
  }
  .site-nav__logo {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    border-radius: 50%;
    border: 1px solid rgba(0,0,0,0.06);
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
  }
  .site-nav__logo svg {
    width: 22px;
    height: 22px;
    fill: var(--color-accent);
  }
  .site-nav__menu {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .site-nav__link {
    font-family: var(--font-body);
    font-size: 0.95rem;
    font-weight: 500;
    color: rgba(0, 0, 0, 0.65);
    padding: 7px 16px;
    border-radius: 999px;
    transition: all 0.2s ease;
  }
  .site-nav__link:hover {
    color: #000;
    background: rgba(0, 0, 0, 0.04);
    text-decoration: none;
  }
  .site-nav__link.is-active {
    background: rgba(0, 0, 0, 0.07);
    color: #111;
    font-weight: 600;
    border: 1px solid rgba(0, 0, 0, 0.08);
  }
  @media (max-width: 650px) {
    .site-nav { padding: 0 12px; height: 54px; }
    .site-nav__link { padding: 6px 10px; font-size: 0.86rem; }
    .site-nav__brand span { display: none; }
  }

  /* ============================== CHAT SECTION ============================== */
  main {
    flex: 1;
    padding-top: 112px;
  }
  .chat-section {
    max-width: 760px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }
  .chat-title {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(2.6rem, 7vw, 4.2rem);
    color: #4A4235;
    text-align: center;
    margin: 0 0 10px;
    letter-spacing: -0.02em;
  }
  .chat-subtitle {
    text-align: center;
    font-size: 1.15rem;
    color: rgba(74, 66, 53, 0.75);
    margin: 0 0 28px;
    line-height: 1.4;
  }

  /* Quick Suggestion Chips */
  .chip-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-bottom: 28px;
  }
  .chip {
    font-family: var(--font-body);
    font-size: 0.92rem;
    font-weight: 600;
    padding: 8px 18px;
    border-radius: 999px;
    border: 1.5px solid rgba(0, 0, 0, 0.18);
    background: #fff;
    color: rgba(0, 0, 0, 0.65);
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
  }
  .chip:hover {
    border-color: var(--color-accent);
    color: var(--color-accent);
    transform: translateY(-1px);
    box-shadow: 0 4px 10px rgba(24, 24, 254, 0.08);
  }
  .chip:active {
    transform: translateY(0);
  }

  /* Chat Box Container */
  .chat-box {
    background: #fff;
    border: 1px solid rgba(0, 0, 0, 0.15);
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 12px 36px rgba(0, 0, 0, 0.04);
    display: flex;
    flex-direction: column;
  }
  .chat-header-bar {
    padding: 12px 20px;
    background: #FAFAF8;
    border-bottom: 1px solid rgba(0,0,0,0.06);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.85rem;
    color: rgba(0,0,0,0.5);
  }
  .chat-status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 500;
  }
  .chat-status__dot {
    width: 8px;
    height: 8px;
    background: #10B981;
    border-radius: 50%;
    box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
  }
  .chat-list {
    height: 420px;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }
  .chat-msg {
    max-width: 82%;
    padding: 14px 18px;
    border-radius: 18px;
    line-height: 1.55;
    font-size: 1rem;
    word-wrap: break-word;
    animation: fadeInMsg 0.25s ease-out;
  }
  @keyframes fadeInMsg {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .chat-msg--bot {
    align-self: flex-start;
    background: rgba(0, 0, 0, 0.05);
    color: #1a1a1a;
    border-bottom-left-radius: 4px;
  }
  .chat-msg--bot strong {
    color: #000;
    font-weight: 700;
  }
  .chat-msg--bot em {
    color: rgba(0,0,0,0.7);
  }
  .chat-msg--user {
    align-self: flex-end;
    background: var(--color-accent);
    color: #fff;
    border-bottom-right-radius: 4px;
    box-shadow: 0 4px 14px rgba(24, 24, 254, 0.25);
  }

  /* Markdown & List formatting inside Bot Bubble */
  .bot-formatted-content p {
    margin: 0 0 8px 0;
  }
  .bot-formatted-content p:last-child {
    margin-bottom: 0;
  }
  .bot-formatted-content ul {
    margin: 6px 0;
    padding-left: 0;
  }
  .bot-formatted-content li {
    position: relative;
    padding-left: 14px;
    margin-bottom: 4px;
  }
  .bot-formatted-content li::before {
    content: "•";
    position: absolute;
    left: 0;
    color: var(--color-accent);
    font-weight: bold;
  }

  /* Animated Typing Indicator */
  .chat-typing {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 14px 18px;
    background: rgba(0, 0, 0, 0.05);
    border-radius: 18px;
    border-bottom-left-radius: 4px;
    align-self: flex-start;
  }
  .chat-typing span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.4);
    animation: chatDot 1.1s ease-in-out infinite;
  }
  .chat-typing span:nth-child(2) { animation-delay: 0.18s; }
  .chat-typing span:nth-child(3) { animation-delay: 0.36s; }
  @keyframes chatDot {
    0%, 100% { opacity: 0.3; transform: translateY(0); }
    50% { opacity: 1; transform: translateY(-4px); }
  }

  /* Chat Input Row */
  .chat-input {
    display: flex;
    gap: 12px;
    padding: 14px 16px;
    border-top: 1px solid rgba(0, 0, 0, 0.1);
    background: #FAFAF8;
  }
  .chat-input input {
    flex: 1;
    font-family: var(--font-body);
    font-size: 1.02rem;
    padding: 12px 20px;
    border-radius: 999px;
    border: 1.5px solid rgba(0, 0, 0, 0.15);
    background: #fff;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .chat-input input:focus {
    border-color: var(--color-accent);
    box-shadow: 0 0 0 3px rgba(24, 24, 254, 0.12);
  }
  .chat-input button {
    font-family: var(--font-body);
    font-size: 0.98rem;
    font-weight: 600;
    padding: 0 28px;
    border-radius: 999px;
    border: none;
    background: var(--color-accent);
    color: #fff;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
    box-shadow: 0 4px 12px rgba(24, 24, 254, 0.2);
  }
  .chat-input button:hover {
    background: var(--color-accent-hover);
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(24, 24, 254, 0.3);
  }
  .chat-input button:active {
    transform: translateY(0);
  }

  /* ============================== FOOTER ============================== */
  .site-footer {
    border-top: 1px solid rgba(0,0,0,0.1);
    background: #fff;
    padding: 32px 24px;
    margin-top: 40px;
  }
  .site-footer__inner {
    max-width: 920px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    font-size: 0.95rem;
    color: rgba(0,0,0,0.6);
  }
  .site-footer__links {
    display: flex;
    gap: 18px;
  }
  .site-footer__links a {
    color: rgba(0,0,0,0.7);
    font-weight: 500;
  }
  .site-footer__links a:hover {
    color: var(--color-accent);
  }
</style>
</head>
<body>

  <a href="index.html" class="site-nav__brand">
    <div class="site-nav__logo">

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<!-- REACT CHAT APPLICATION -->
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const PROMPT_CHIPS = [
  "who is the head of r and d",
  "How do I join?",
  "When is the next hackathon?",
  "Who are the heads of Projects?",
  "Who is the RCB fan?",
  "Who chose Don Toliver?",
  "Is there a membership fee?",
  "How do I contact the team?"
];

// Helper to format bot responses with simple markdown (bold, links, newlines, bullets)
function formatMessage(text) {
  if (!text) return null;
  const lines = text.split('\n');

  return (
    <div className="bot-formatted-content">
      {lines.map((line, idx) => {
        if (!line.trim()) {
          return <div key={idx} style={{ height: '6px' }} />;
        }

        // Bullet point
        const isBullet = line.trim().startsWith('•') || line.trim().startsWith('* ') || line.trim().startsWith('- ');
        const cleanLine = isBullet ? line.trim().replace(/^[•*-]\s*/, '') : line;

        // Parse bold **text** and [link](url)
        const parts = [];
        let cursor = 0;
        const regex = /(\*\*([^*]+)\*\*|\[([^\]]+)\]\(([^)]+)\))/g;
        let match;

        while ((match = regex.exec(cleanLine)) !== null) {
          if (match.index > cursor) {
            parts.push(cleanLine.substring(cursor, match.index));
          }
          if (match[2]) {
            // Bold
            parts.push(<strong key={match.index}>{match[2]}</strong>);
          } else if (match[3] && match[4]) {
            // Link
            parts.push(
              <a key={match.index} href={match[4]} target="_blank" rel="noopener noreferrer">
                {match[3]}
              </a>
            );
          }
          cursor = regex.lastIndex;
        }
        if (cursor < cleanLine.length) {
          parts.push(cleanLine.substring(cursor));
        }

        if (isBullet) {
          return <li key={idx}>{parts}</li>;
        }
        return <p key={idx}>{parts}</p>;
      })}
    </div>
  );
}

function ChatPage() {
  const [messages, setMessages] = useState([
    {
      from: 'bot',
      text: "Hi! Ask me anything about IETE-SF, our 13 departments, heads, subheads, executives, traits, or tap a question below!"
    }
  ]);
  const [input, setInput] = useState('');
  const [typing, setTyping] = useState(false);
  const listRef = useRef(null);

  // Auto-scroll to bottom of chat list
  useEffect(() => {
    if (listRef.current) {
      listRef.current.scrollTop = listRef.current.scrollHeight;
    }
  }, [messages, typing]);

  const send = (queryText) => {
    const q = (queryText || input).trim();
    if (!q || typing) return;

    // Append user message
    setMessages(prev => [...prev, { from: 'user', text: q }]);
    setInput('');
    setTyping(true);

    // Natural bot response delay
    setTimeout(() => {
      let botReply = "";
      if (window.ChatbotEngine && typeof window.ChatbotEngine.processQuery === 'function') {
        botReply = window.ChatbotEngine.processQuery(q);
      } else {
        botReply = "I am ready to answer your questions! You can ask about department heads, executives, or hackathons.";
      }

      setMessages(prev => [...prev, { from: 'bot', text: botReply }]);
      setTyping(false);
    }, 450);
  };

  return (
    <section className="chat-section">
      <h1 className="chat-title">chat w us</h1>
      <p className="chat-subtitle">Ask us anything about IETE-SF, our events or how to join.</p>

      {/* Suggested Prompt Chips */}
      <div className="chip-row">
        {PROMPT_CHIPS.map((chipText) => (
          <button
            key={chipText}
            className="chip"
            onClick={() => send(chipText)}
          >
            {chipText}
          </button>
        ))}
      </div>

      {/* Chat Window */}
      <div className="chat-box">
        <div className="chat-header-bar">
          <div className="chat-status">
            <span className="chat-status__dot"></span>
            <span>IETE-SF Assistant (Online)</span>
          </div>
          <span>SVKM's NMIMS MPSTME</span>
        </div>

        <div className="chat-list" ref={listRef}>
          {messages.map((m, i) => (
            <div key={i} className={`chat-msg chat-msg--${m.from}`}>
              {m.from === 'bot' ? formatMessage(m.text) : m.text}
            </div>
          ))}

          {typing && (
            <div className="chat-typing">
              <span></span>
              <span></span>
              <span></span>
            </div>
          )}
        </div>

        {/* Input Bar */}
        <div className="chat-input">
          <input
            value={input}
            placeholder="type your question..."
            onChange={(e) => setInput(e.target.value)}
            onKeyDown={(e) => {
              if (e.key === 'Enter') send();
            }}
            autoFocus
          />
          <button onClick={() => send()}>send</button>
        </div>
      </div>
    </section>
  );
}

function App() {
  return <ChatPage />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
